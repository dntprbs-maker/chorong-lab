<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>초롱이 개인 일정판</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f3f6fb;color:#17243b;max-width:1050px;margin:auto;padding:12px}button,input,textarea{font:inherit}button{border:1px solid #cdd8e9;background:white;border-radius:9px;padding:9px;cursor:pointer;color:#203454}.primary,.on{background:#245fe1;color:white}.card{background:white;border-radius:15px;padding:15px;margin:10px 0;border:1px solid #e0e8f2}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.group{display:flex;gap:6px;align-items:center}.muted{color:#65748a;font-size:13px}h1{font-size:21px;margin:4px 0}#heading{font-size:19px}.hidden{display:none!important}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.cell{border:1px solid #e2e8f0;border-right:0;border-bottom:0;min-width:0;min-height:85px;padding:4px}.cell:nth-child(7n){border-right:1px solid #e2e8f0}.daynum{border:0;padding:4px;font-weight:bold}.today{background:#edf4ff}.outside{opacity:.45}.ev{font-size:12px;background:#eef3fb;padding:3px;margin:3px 0;border-radius:4px;overflow-wrap:anywhere;cursor:pointer}.ev.done{color:#25834a;background:#eaf7ec}.ev.cancel{color:#a33;background:#fff0f0;text-decoration:line-through}.more{font-size:11px;color:#63758d}.weekbtn{width:100%;border-radius:0;background:#f2f6fc;font-size:12px;margin-bottom:4px}.compact .cell{min-height:55px}.agenda{display:flex;gap:9px;align-items:center;border:1px solid #e1e8f1;border-radius:10px;padding:10px;margin:8px 0}.state{min-width:40px;min-height:40px}.time{font-weight:bold;min-width:52px}.title{flex:1;text-align:left;border:0;overflow-wrap:anywhere}.strike{text-decoration:line-through;color:#8994a6}dialog{border:0;border-radius:16px;padding:20px;width:min(94vw,480px);box-shadow:0 12px 60px #0005}dialog::backdrop{background:#14233a77}dialog label{display:block;margin:10px 0}dialog input,dialog textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;flex-wrap:wrap}.weekday{text-align:center;font-size:12px;font-weight:bold;padding:8px}.tip{font-size:12px;color:#718096}@media(max-width:550px){body{padding:6px}.card{padding:9px}.cell{padding:2px}.ev{font-size:10px}.daynum{font-size:12px;padding:3px}.week{gap:0}.more{font-size:10px}h1{font-size:18px}}

/* Single phone-width layout on every device, including desktop */
html{min-height:100%;background:#e9eef6}body{width:100%;max-width:430px!important;margin:0 auto!important;padding:8px!important;min-height:100vh;background:#f3f6fb;box-shadow:0 0 24px #17243b12}.card{padding:10px}.row{gap:6px}.group{gap:4px}.group button{padding:8px}.cell{padding:2px}.ev{font-size:10px;line-height:1.3}.daynum{font-size:12px;padding:3px}.more{font-size:10px}.week{grid-template-columns:repeat(7,minmax(0,1fr))}@media(min-width:431px){body{border-left:1px solid #dde5f0;border-right:1px solid #dde5f0}}

/* Phone-height-aware monthly calendar; desktop previews a phone-sized canvas. */
:root{--phone-height:100dvh;--month-row-height:72px}#monthPanel .cell{min-height:var(--month-row-height);height:var(--month-row-height);overflow:hidden}#monthPanel .week.expanded .cell{height:auto;min-height:var(--month-row-height);overflow:visible}#monthPanel .week.compact .cell{height:44px;min-height:44px}#monthPanel .weekbtn{padding:5px 2px;margin:0 0 3px;border-radius:4px;min-height:27px}#monthPanel .weekday{padding:4px 0}#monthPanel .ev{margin:2px 0;padding:2px}#monthPanel .cell .more{line-height:1.15}@media(min-width:431px){:root{--phone-height:844px}}
</style></head><body><header class="card row"><div><h1>📅 초롱이 개인 일정판</h1><div class="muted">개인용 · 브라우저 저장 · 외부 연동 없음</div></div><div class="group"><button id="daily" class="on">일간</button><button id="monthly">월간</button><button id="settings">설정</button></div></header><main class="card"><div class="row"><div class="group"><button id="prev">‹</button><b id="heading"></b><button id="next">›</button></div><div class="group"><button id="todayBtn">오늘</button><button id="calBtn">📅 달력</button><input id="datePicker" type="date" class="hidden"></div></div><section id="dayPanel"><p id="stats" class="muted"></p><div id="agenda"></div></section><section id="monthPanel" class="hidden"><div class="week" id="weekdays"></div><div id="calendar"></div></section><div class="row" style="margin-top:16px"><button id="add" class="primary">＋ 일정 추가</button><button id="closeDay">하루 마감하기</button></div></main>
<dialog id="editDlg"><h3 id="editHeading">일정 추가</h3><form id="editForm"><label>날짜<input id="edDate" type="date" required></label><label>시간<input id="edTime" type="time" required></label><label>제목<input id="edTitle" required maxlength="180"></label><label>메모<textarea id="edMemo" rows="3"></textarea></label><menu><button id="remove" type="button">삭제</button><button type="button" data-dismiss="editDlg">취소</button><button class="primary">저장</button></menu></form></dialog>
<dialog id="statusDlg"><h3>일정 상태</h3><p id="statusTitle"></p><div class="row"><button data-state="done">✅ 완료</button><button data-state="cancel">🚫 취소</button><button data-state="todo">↩ 미완료</button></div><menu><button data-dismiss="statusDlg">닫기</button></menu></dialog>
<dialog id="carryDlg"><h3 id="carryHeading">미완료 일정 확인</h3><p id="carryText" class="muted"></p><div id="carryList"></div><menu><button id="later">나중에</button><button id="selectedCarry">선택 이동</button><button id="allCarry" class="primary">전체 이동</button></menu></dialog>
<dialog id="settingsDlg"><h3>작업일 설정</h3><p class="muted">기본은 00:00 시작. 필요하면 09:00 등으로 변경할 수 있어요.</p><label>작업일 시작 시각<input type="time" id="startAt"></label><menu><button data-dismiss="settingsDlg">취소</button><button id="saveSettings" class="primary">저장</button></menu></dialog>
<script>
(()=>{const $=s=>document.querySelector(s),key='chorong-planner-v2';let db;try{db=JSON.parse(localStorage.getItem(key))}catch{}if(!db||!Array.isArray(db.items)){db={items:[],start:'00:00',history:[]};try{const old=JSON.parse(localStorage.getItem('chorong-planner-v1')||'{}');for(const [date,arr] of Object.entries(old))for(const x of arr)db.items.push({id:String(x.id),date,time:x.time,title:x.title,memo:'',status:x.done?'done':'todo'})}catch{}}db.history??=[];db.start??='00:00';const save=()=>localStorage.setItem(key,JSON.stringify(db)),pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),parse=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)},plus=(s,n)=>{let d=parse(s);d.setDate(d.getDate()+n);return fmt(d)},workday=()=>{let d=new Date();if(pad(d.getHours())+':'+pad(d.getMinutes())<db.start)d.setDate(d.getDate()-1);return fmt(d)},items=date=>db.items.filter(x=>x.date===date).sort((a,b)=>a.time.localeCompare(b.time)),mark=x=>x.status==='done'?'✅':x.status==='cancel'?'🚫':'☐';let day=workday(),view='day',expanded=null,editId=null,stateId=null,carryMode='close',promptDay='';
function render(){const d=parse(day);$('#heading').textContent=view==='day'?d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일':d.getFullYear()+'년 '+(d.getMonth()+1)+'월';$('#daily').classList.toggle('on',view==='day');$('#monthly').classList.toggle('on',view==='month');$('#dayPanel').classList.toggle('hidden',view!=='day');$('#monthPanel').classList.toggle('hidden',view!=='month');if(view==='day')renderDay();else renderMonth()}
function renderDay(){const a=items(day);$('#stats').textContent='총 '+a.length+'건 · 완료 '+a.filter(x=>x.status==='done').length+'건 · 미완료 '+a.filter(x=>x.status==='todo').length+'건';const box=$('#agenda');box.replaceChildren();if(!a.length)box.textContent='등록된 일정이 없습니다.';for(const x of a){const row=document.createElement('div');row.className='agenda';const b=document.createElement('button');b.className='state';b.textContent=mark(x);b.title='짧게: 완료 / 길게: 상태 선택';let timer,held=false;const menu=()=>{held=true;stateId=x.id;$('#statusTitle').textContent=x.title;$('#statusDlg').showModal()};b.addEventListener('pointerdown',e=>{if(e.button===0){held=false;timer=setTimeout(menu,550)}});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(timer)));b.addEventListener('click',()=>{if(held){held=false;return}if(x.status==='done')menu();else setState(x.id,'done')});b.addEventListener('contextmenu',e=>{e.preventDefault();clearTimeout(timer);menu()});const t=document.createElement('span');t.className='time';t.textContent=x.time;const title=document.createElement('button');title.className='title'+(x.status==='todo'?'':' strike');title.textContent=x.title+(x.memo?' · '+x.memo:'');title.onclick=()=>openEdit(x.id);row.append(b,t,title);box.append(row)}}
function renderMonth(){const d=parse(day),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1,12),start=fmt(new Date(y,m,1-first.getDay(),12)),rows=Math.ceil((first.getDay()+new Date(y,m+1,0).getDate())/7),container=$('#calendar');const phoneHeight=window.innerWidth>430?844:(window.visualViewport?.height||window.innerHeight);const fixed=$('header').offsetHeight+$('#heading').closest('.row').offsetHeight+$('#weekdays').offsetHeight+$('#add').closest('.row').offsetHeight+95;const rowHeight=Math.max(47,Math.min(115,Math.floor((phoneHeight-fixed-rows*31)/rows)));document.documentElement.style.setProperty('--month-row-height',rowHeight+'px');$('#weekdays').innerHTML=['일','월','화','수','목','금','토'].map(x=>'<div class="weekday">'+x+'</div>').join('');container.replaceChildren();for(let w=0;w<rows;w++){const ws=plus(start,w*7),open=expanded===ws,compact=expanded!==null&&!open;const grid=document.createElement('div');grid.className='week'+(compact?' compact':'');for(let j=0;j<7;j++){const date=plus(ws,j),dt=parse(date),arr=items(date),cell=document.createElement('div');cell.className='cell'+(date===workday()?' today':'')+(dt.getMonth()!==m?' outside':'');const n=document.createElement('button');n.className='daynum';n.textContent=dt.getDate();n.onclick=()=>{day=date;view='day';render()};cell.append(n);if(compact){const count=document.createElement('div');count.className='more';count.textContent=arr.length+'건';cell.append(count)}else{const max=open?arr.length:window.innerWidth<380?2:window.innerWidth<700?3:5;for(const x of arr.slice(0,max)){const el=document.createElement('div');el.className='ev '+(x.status==='done'?'done':x.status==='cancel'?'cancel':'');el.textContent=(x.status==='todo'?'':mark(x)+' ')+x.time+' '+x.title;el.onclick=()=>openEdit(x.id);cell.append(el)}if(arr.length>max){const more=document.createElement('div');more.className='more';more.textContent='+'+(arr.length-max)+'건';cell.append(more)}}grid.append(cell)}container.append(grid);const toggle=document.createElement('button');toggle.className='weekbtn';toggle.textContent=open?'⌃ '+(w+1)+'째 주 접기':'⌄ '+(w+1)+'째 주 펼치기';toggle.onclick=()=>{expanded=open?null:ws;render()};container.append(toggle)}}
function setState(id,status){const x=db.items.find(x=>x.id===id);if(x){x.status=status;save();render()}$('#statusDlg').close()}
function openEdit(id){editId=id||null;const x=db.items.find(x=>x.id===id);$('#editHeading').textContent=x?'일정 수정':'일정 추가';$('#edDate').value=x?.date||day;$('#edTime').value=x?.time||'09:00';$('#edTitle').value=x?.title||'';$('#edMemo').value=x?.memo||'';$('#remove').classList.toggle('hidden',!x);$('#editDlg').showModal()}
$('#editForm').onsubmit=e=>{e.preventDefault();const date=$('#edDate').value,time=$('#edTime').value,title=$('#edTitle').value.trim();if(!title||!date||!time)return;let x=db.items.find(x=>x.id===editId);if(x){if(x.date!==date)db.history.push({id:x.id,from:x.date,to:date,at:new Date().toISOString()});Object.assign(x,{date,time,title,memo:$('#edMemo').value})}else db.items.push({id:String(Date.now())+Math.random(),date,time,title,memo:$('#edMemo').value,status:'todo'});day=date;save();$('#editDlg').close();render()};
$('#remove').onclick=()=>{if(!confirm('일정 원본을 삭제할까요? 완료나 취소와 다릅니다.'))return;db.items=db.items.filter(x=>x.id!==editId);save();$('#editDlg').close();render()};document.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=()=>$('#'+b.dataset.dismiss).close());document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>setState(stateId,b.dataset.state));
$('#add').onclick=()=>openEdit();$('#daily').onclick=()=>{view='day';render()};$('#monthly').onclick=()=>{view='month';render()};$('#prev').onclick=()=>{day=view==='day'?plus(day,-1):fmt(new Date(parse(day).getFullYear(),parse(day).getMonth()-1,1,12));expanded=null;render()};$('#next').onclick=()=>{day=view==='day'?plus(day,1):fmt(new Date(parse(day).getFullYear(),parse(day).getMonth()+1,1,12));expanded=null;render()};$('#todayBtn').onclick=()=>{day=workday();render()};$('#calBtn').onclick=()=>{$('#datePicker').classList.toggle('hidden');$('#datePicker').value=day};$('#datePicker').onchange=e=>{if(e.target.value){day=e.target.value;$('#datePicker').classList.add('hidden');render()}};
$('#settings').onclick=()=>{$('#startAt').value=db.start;$('#settingsDlg').showModal()};$('#saveSettings').onclick=()=>{db.start=$('#startAt').value||'00:00';save();$('#settingsDlg').close();checkOverdue()};
function carry(mode){carryMode=mode;const eligible=db.items.filter(x=>x.status==='todo'&&(mode==='close'?x.date===day:x.date<workday()));if(!eligible.length){if(mode==='close')alert('미완료 일정이 없습니다.');return}$('#carryHeading').textContent=mode==='close'?'하루 마감하기':'지난 미완료 일정';$('#carryText').textContent=mode==='close'?'선택한 일정을 다음 날짜로 옮길까요?':'이전 작업일 미완료 '+eligible.length+'건을 오늘로 옮길까요?';const box=$('#carryList');box.replaceChildren();for(const x of eligible){const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.value=x.id;cb.checked=true;label.append(cb,document.createTextNode(' '+x.date+' '+x.time+' '+x.title));box.append(label)}$('#carryDlg').showModal()}
function move(all){const ids=[...$('#carryList').querySelectorAll('input')].filter(x=>all||x.checked).map(x=>x.value),target=carryMode==='close'?plus(day,1):workday();if(!ids.length)return;if(!confirm(ids.length+'건을 '+target+'로 이동할까요?'))return;for(const x of db.items)if(ids.includes(x.id)&&x.date!==target){db.history.push({id:x.id,from:x.date,to:target,at:new Date().toISOString()});x.date=target}save();$('#carryDlg').close();render()}
$('#closeDay').onclick=()=>carry('close');$('#allCarry').onclick=()=>move(true);$('#selectedCarry').onclick=()=>move(false);$('#later').onclick=()=>{promptDay=workday();$('#carryDlg').close()};function checkOverdue(){const today=workday();if(promptDay!==today&&db.items.some(x=>x.status==='todo'&&x.date<today)){promptDay=today;carry('overdue')}}setTimeout(checkOverdue,1000);setInterval(checkOverdue,60000);
let sx,sy;$('#dayPanel').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$('#dayPanel').addEventListener('touchend',e=>{if(sx===undefined)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=undefined;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.5){day=plus(day,dx>0?1:-1);render()}},{passive:true});window.addEventListener('resize',()=>{if(view==='month')renderMonth()});save();render()})();
</script></body></html>
