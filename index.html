<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>초롱이 개인 일정판</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#202637;max-width:640px;margin:0 auto;padding:24px}h1{font-size:27px}.card{background:white;padding:20px;border-radius:16px;margin:16px 0;box-shadow:0 3px 14px #0001}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #ccd2dc}button{background:#243b78;color:white;cursor:pointer}li{padding:12px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px}li span{flex:1}.done{text-decoration:line-through;color:#888}.muted{color:#667085;font-size:14px}</style></head><body><h1>📅 초롱이 개인 일정판</h1><p class="muted">독립 시험용 앱 · 브라우저에만 저장 · 외부 일정 연동 없음</p><div class="card"><label>날짜 <input type="date" id="day"></label> <button onclick="changeDay(-1)">◀</button> <button onclick="changeDay(1)">▶</button></div><div class="card"><h2>일정 추가</h2><input id="time" type="time" value="09:00"><input id="title" placeholder="할 일 입력"><button onclick="add()">추가</button></div><div class="card"><h2>이날의 일정 <small id="count"></small></h2><ul id="list" style="list-style:none;padding:0"></ul></div><script>const day=document.querySelector('#day'),title=document.querySelector('#title'),time=document.querySelector('#time'),list=document.querySelector('#list'),count=document.querySelector('#count');day.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);let all=JSON.parse(localStorage.getItem('chorong-planner-v1')||'{}');function save(){localStorage.setItem('chorong-planner-v1',JSON.stringify(all))}function changeDay(n){let d=new Date(day.value+'T12:00:00');d.setDate(d.getDate()+n);day.value=d.toISOString().slice(0,10);render()}function add(){let v=title.value.trim();if(!v)return; (all[day.value]??=[]).push({id:Date.now()+Math.random(),time:time.value,title:v,done:false});title.value='';save();render()}function toggle(id){let x=all[day.value].find(x=>x.id===id);x.done=!x.done;save();render()}function remove(id){if(!confirm('이 일정만 삭제할까요?'))return;all[day.value]=all[day.value].filter(x=>x.id!==id);save();render()}function render(){list.replaceChildren();let arr=[...(all[day.value]||[])].sort((a,b)=>a.time.localeCompare(b.time));count.textContent='('+arr.length+'건)';if(!arr.length){let p=document.createElement('p');p.textContent='등록된 일정이 없습니다.';list.append(p)}for(let x of arr){let li=document.createElement('li'),b=document.createElement('input'),s=document.createElement('span'),del=document.createElement('button');b.type='checkbox';b.checked=x.done;b.onchange=()=>toggle(x.id);s.textContent=x.time+' · '+x.title;s.className=x.done?'done':'';del.textContent='삭제';del.onclick=()=>remove(x.id);li.append(b,s,del);list.append(li)}}day.onchange=render;title.onkeydown=e=>{if(e.key==='Enter')add()};render()</script></body></html>
